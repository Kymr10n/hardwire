name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-editor

      - name: Install Godot
        run: tools/install_godot.sh "$GODOT_VERSION" "$HOME/godot"

      - name: Run tests
        run: GODOT="$HOME/godot/godot" tools/run_tests.sh

  export:
    name: Export ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: web
            preset: Web
            output: build/web/index.html
          - name: linux
            preset: Linux
            output: build/linux/hardwire.x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-templates

      - name: Install Godot and export templates
        run: tools/install_godot.sh "$GODOT_VERSION" "$HOME/godot" --templates

      - name: Export
        run: GODOT="$HOME/godot/godot" tools/export.sh "${{ matrix.preset }}" "${{ matrix.output }}"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: hardwire-${{ matrix.name }}
          path: ${{ matrix.output == 'build/web/index.html' && 'build/web' || 'build/linux' }}
          retention-days: 14
