name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read pinned versions
        run: grep -E "^[A-Z_]+=" tools/versions.env >> "$GITHUB_ENV"

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-editor

      - name: Install Godot
        run: tools/install_godot.sh "$GODOT_VERSION" "$HOME/godot"

      - name: Setup (gdtoolkit)
        run: GODOT="$HOME/godot/godot" tools/setup.sh

      # DRIFT_BASE makes the drift check compare the whole PR / push against its base commit
      # (locally it looks at uncommitted changes), so a SPEC change without a decision fails.
      - name: Quality gate (format, lint, drift, script errors, tests)
        env:
          DRIFT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: GODOT="$HOME/godot/godot" tools/check.sh

  # One job for all three exports: Godot and the templates are restored and installed once.
  export:
    name: Export (web, linux, windows)
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned versions
        run: grep -E "^[A-Z_]+=" tools/versions.env >> "$GITHUB_ENV"

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-templates

      - name: Install Godot and export templates
        run: tools/install_godot.sh "$GODOT_VERSION" "$HOME/godot" --templates

      - name: Export
        run: |
          export GODOT="$HOME/godot/godot"
          tools/export.sh Web build/web/index.html
          tools/export.sh Linux build/linux/hardwire.x86_64
          tools/export.sh Windows build/windows/hardwire.exe

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: hardwire-web
          path: build/web
          retention-days: 14

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: hardwire-linux
          path: build/linux
          retention-days: 14

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: hardwire-windows
          path: build/windows
          retention-days: 14
